name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # pdftotext / pdfimages (Poppler) : les tests vérifient le texte et les images des PDF produits.
      - name: PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the single file
        run: npm run build
      - name: The published app and schema match the sources
        run: |
          git show HEAD:docs/folio-pages.html > /tmp/published.html
          cp /tmp/published.html docs/folio-pages.html
          node scripts/check-published.mjs
          git diff --exit-code -- docs/schema
      - name: Unit tests
        run: npm test
      - name: Browsers
        run: npx playwright install --with-deps chromium firefox
      - name: End-to-end tests
        run: npx playwright test --project=chromium-ci --project=firefox
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
